
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deelu Clips AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #10121b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      background: #1b1e2b;
      padding: 24px;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
      color: #8b7cff;
    }

    .subtitle {
      text-align: center;
      color: #b8b8c7;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #41445a;
      border-radius: 8px;
      background: #10121b;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #7564ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      color: #c5bfff;
      line-height: 1.5;
    }

    .clip {
      margin-top: 15px;
      padding: 16px;
      background: #272b3b;
      border-radius: 10px;
      border-left: 4px solid #8b7cff;
    }

    .clip h3 {
      margin-top: 0;
      color: #a99eff;
    }

    .score {
      color: #63e6a5;
      font-weight: bold;
    }

    .small {
      color: #999caf;
      font-size: 12px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Deelu Clips AI</h1>

    <p class="subtitle">
      Turn YouTube videos into viral clip ideas with AI.
    </p>

    <label for="videoUrl">YouTube Video URL</label>
    <input
      id="videoUrl"
      type="url"
      placeholder="Paste YouTube video link here"
    >

    <label for="duration">Clip Duration</label>
    <select id="duration">
      <option value="30">30 Seconds</option>
      <option value="45">45 Seconds</option>
      <option value="60">60 Seconds</option>
    </select>

    <label for="transcript">Video Transcript</label>
    <textarea
      id="transcript"
      placeholder="Transcript will appear here automatically..."
    ></textarea>

    <button id="generate" onclick="generateClips()">
      Generate Viral Clips
    </button>

    <div id="status"></div>
    <div id="results"></div>

    <p class="small">
      Powered by Gemini AI and Supadata
    </p>

  </div>

  <script>
    async function generateClips() {
      const url = document.getElementById("videoUrl").value.trim();
      const duration = Number(document.getElementById("duration").value);
      const transcriptBox = document.getElementById("transcript");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const button = document.getElementById("generate");

      if (!url) {
        status.textContent = "Please enter a YouTube URL.";
        return;
      }

      if (!/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url)) {
        status.textContent = "Please enter a valid YouTube URL.";
        return;
      }

      button.disabled = true;
      results.innerHTML = "";

      try {
        status.textContent = "Step 1/2: Fetching YouTube transcript...";

        const transcriptResponse = await fetch("/api/transcript", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ url })
        });

        const transcriptData = await transcriptResponse.json();

        if (!transcriptResponse.ok) {
          throw new Error(
            transcriptData.error || "Transcript fetch failed."
          );
        }

        const transcript = transcriptData.transcript;

        if (!transcript || transcript.length < 50) {
          throw new Error("No usable transcript found.");
        }

        transcriptBox.value = transcript;

        status.textContent = "Step 2/2: Gemini AI is analyzing...";

        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            transcript,
            duration
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "AI analysis failed.");
        }

        if (!Array.isArray(data.clips)) {
          throw new Error("AI returned an unexpected response.");
        }

        status.textContent = "AI analysis completed successfully!";

        results.innerHTML = "<h2>AI Generated Clip Suggestions</h2>";

        data.clips.forEach(clip => {
          const card = document.createElement("div");
          card.className = "clip";

          const title = document.createElement("h3");
          title.textContent = "🔥 " + (clip.title || "Untitled Clip");

          const time = document.createElement("p");
          time.textContent =
            "Start: " + clip.start + "s | End: " + clip.end + "s";

          const score = document.createElement("p");
          score.className = "score";
          score.textContent =
            "AI Potential Score: " + clip.score + "/100";

          const reason = document.createElement("p");
          reason.textContent = "Reason: " + (clip.reason || "");

          card.append(title, time, score, reason);
          results.appendChild(card);
        });

      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
